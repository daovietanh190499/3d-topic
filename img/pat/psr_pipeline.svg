<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 280' font-family='Noto Sans,Helvetica,Arial,sans-serif'><title>Pipeline PSR</title><rect width='960' height='280' fill='white'/><text x='480' y='28' font-size='16' fill='#2f3e7a' text-anchor='middle' font-weight='700'>Thuật toán Poisson Surface Reconstruction (Kazhdan et al. 2006)</text><rect x='30' y='60' width='170' height='120' rx='10' fill='#edf4ff' stroke='#2f3e7a' stroke-width='2'/><text x='115' y='95' font-size='15' fill='#222' text-anchor='middle' font-weight='700'>1. Đầu vào</text><text x='115' y='122' font-size='13' fill='#444' text-anchor='middle' font-weight='normal'>điểm + pháp tuyến</text><text x='115' y='142' font-size='13' fill='#444' text-anchor='middle' font-weight='normal'>(p_i, n_i)</text><defs><marker id='a200120' markerWidth='8' markerHeight='8' refX='7' refY='3' orient='auto'><path d='M0,0 L8,3 L0,6 Z' fill='#2f3e7a'/></marker></defs><line x1='200' y1='120' x2='220' y2='120' stroke='#2f3e7a' stroke-width='2.2' marker-end='url(#a200120)'/><rect x='220' y='60' width='170' height='120' rx='10' fill='#f7efe6' stroke='#b15a2b' stroke-width='2'/><text x='305' y='95' font-size='15' fill='#222' text-anchor='middle' font-weight='700'>2. Octree</text><text x='305' y='122' font-size='13' fill='#444' text-anchor='middle' font-weight='normal'>lưới thích nghi</text><text x='305' y='142' font-size='13' fill='#444' text-anchor='middle' font-weight='normal'>quanh điểm</text><defs><marker id='a390120' markerWidth='8' markerHeight='8' refX='7' refY='3' orient='auto'><path d='M0,0 L8,3 L0,6 Z' fill='#2f3e7a'/></marker></defs><line x1='390' y1='120' x2='410' y2='120' stroke='#2f3e7a' stroke-width='2.2' marker-end='url(#a390120)'/><rect x='410' y='60' width='170' height='120' rx='10' fill='#edf4ff' stroke='#2f3e7a' stroke-width='2'/><text x='495' y='95' font-size='15' fill='#222' text-anchor='middle' font-weight='700'>3. Trường V</text><text x='495' y='122' font-size='13' fill='#444' text-anchor='middle' font-weight='normal'>V ≈ ∇χ</text><text x='495' y='142' font-size='13' fill='#444' text-anchor='middle' font-weight='normal'>từ pháp tuyến</text><defs><marker id='a580120' markerWidth='8' markerHeight='8' refX='7' refY='3' orient='auto'><path d='M0,0 L8,3 L0,6 Z' fill='#2f3e7a'/></marker></defs><line x1='580' y1='120' x2='600' y2='120' stroke='#2f3e7a' stroke-width='2.2' marker-end='url(#a580120)'/><rect x='600' y='60' width='170' height='120' rx='10' fill='#f7efe6' stroke='#b15a2b' stroke-width='2'/><text x='685' y='95' font-size='15' fill='#222' text-anchor='middle' font-weight='700'>4. Poisson</text><text x='685' y='122' font-size='13' fill='#444' text-anchor='middle' font-weight='normal'>Δχ = ∇·V</text><text x='685' y='142' font-size='13' fill='#444' text-anchor='middle' font-weight='normal'>giải tuyến tính</text><defs><marker id='a770120' markerWidth='8' markerHeight='8' refX='7' refY='3' orient='auto'><path d='M0,0 L8,3 L0,6 Z' fill='#2f3e7a'/></marker></defs><line x1='770' y1='120' x2='790' y2='120' stroke='#2f3e7a' stroke-width='2.2' marker-end='url(#a770120)'/><rect x='790' y='60' width='170' height='120' rx='10' fill='#edf4ff' stroke='#2f3e7a' stroke-width='2'/><text x='875' y='95' font-size='15' fill='#222' text-anchor='middle' font-weight='700'>5. Isosurface</text><text x='875' y='122' font-size='13' fill='#444' text-anchor='middle' font-weight='normal'>marching cubes</text><text x='875' y='142' font-size='13' fill='#444' text-anchor='middle' font-weight='normal'>χ = χ₀</text><rect x='30' y='210' width='900' height='55' rx='10' fill='#eef7ee' stroke='#2e7d32' stroke-width='2'/><text x='480' y='245' font-size='14' fill='#222' text-anchor='middle' font-weight='normal'>Ý tưởng then chốt: ∇χ ≈ pháp tuyến đã làm mượt  ⇒  lấy divergence rồi giải Poisson để lấy χ (hàm chỉ thị / occupancy)</text></svg>