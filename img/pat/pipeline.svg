<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs><style>
    .b{fill:#edf4ff;stroke:#2f3e7a;stroke-width:2;rx:10}
    .c{fill:#f7efe6;stroke:#b15a2b;stroke-width:2;rx:10}
    .t{font-family:Noto Sans,Arial,sans-serif;font-size:14px;fill:#222;text-anchor:middle}
    .s{font-family:Noto Sans,Arial,sans-serif;font-size:12px;fill:#444;text-anchor:middle}
    .a{stroke:#2f3e7a;stroke-width:2;fill:none;marker-end:url(#arr)}
    </style>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2f3e7a"/></marker>
  </defs>
  <rect class="b" x="20" y="50" width="160" height="90"/><text class="t" x="100" y="90">Point cloud</text><text class="s" x="100" y="115">(pᵢ, nᵢ)</text>
  <rect class="c" x="230" y="50" width="180" height="90"/><text class="t" x="320" y="85">Transformer</text><text class="s" x="320" y="108">lân cận k điểm</text><text class="s" x="320" y="128">→ 6 hệ số aₙₘ</text>
  <rect class="b" x="460" y="50" width="170" height="90"/><text class="t" x="545" y="85">Khớp torus</text><text class="s" x="545" y="108">κ, R, r, c, u</text><text class="s" x="545" y="128">gᵢ = SDF torus</text>
  <rect class="c" x="680" y="50" width="190" height="90"/><text class="t" x="775" y="85">Blend Eq. (1)</text><text class="s" x="775" y="108">softmax khoảng cách</text><text class="s" x="775" y="128">φ(x) ≈ SDF</text>
  <path class="a" d="M185,95 L225,95"/><path class="a" d="M415,95 L455,95"/><path class="a" d="M635,95 L675,95"/>
  <text class="s" x="450" y="185">Tiền tính: 1 lần / đám mây điểm · Truy vấn: song song, không giải PDE toàn cục</text>
