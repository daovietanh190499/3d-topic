<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 300' font-family='Noto Sans,Helvetica,Arial,sans-serif'><title>Indicator gradient</title><rect width='960' height='300' fill='white'/><text x='480' y='28' font-size='16' fill='#2f3e7a' text-anchor='middle' font-weight='700'>Hàm chỉ thị χ và vì sao ∇χ ≈ pháp tuyến</text><ellipse cx='220' cy='160' rx='110' ry='80' fill='#edf4ff' stroke='#2f3e7a' stroke-width='3'/><text x='220' y='155' font-size='18' fill='#2f3e7a' text-anchor='middle' font-weight='700'>χ ≈ 1</text><text x='220' y='178' font-size='13' fill='#555' text-anchor='middle' font-weight='normal'>(trong)</text><text x='60' y='60' font-size='14' fill='#555' text-anchor='start' font-weight='normal'>χ ≈ 0 (ngoài)</text><defs><marker id='n' markerWidth='7' markerHeight='7' refX='6' refY='3' orient='auto'><path d='M0,0 L7,3 L0,6 Z' fill='#b15a2b'/></marker></defs><line x1='330.0' y1='160.0' x2='358.0' y2='160.0' stroke='#b15a2b' stroke-width='2.5' marker-end='url(#n)'/><line x1='297.8' y1='216.6' x2='317.6' y2='236.4' stroke='#b15a2b' stroke-width='2.5' marker-end='url(#n)'/><line x1='220.0' y1='240.0' x2='220.0' y2='268.0' stroke='#b15a2b' stroke-width='2.5' marker-end='url(#n)'/><line x1='142.2' y1='216.6' x2='122.4' y2='236.4' stroke='#b15a2b' stroke-width='2.5' marker-end='url(#n)'/><line x1='110.0' y1='160.0' x2='82.0' y2='160.0' stroke='#b15a2b' stroke-width='2.5' marker-end='url(#n)'/><line x1='142.2' y1='103.4' x2='122.4' y2='83.6' stroke='#b15a2b' stroke-width='2.5' marker-end='url(#n)'/><line x1='220.0' y1='80.0' x2='220.0' y2='52.0' stroke='#b15a2b' stroke-width='2.5' marker-end='url(#n)'/><line x1='297.8' y1='103.4' x2='317.6' y2='83.6' stroke='#b15a2b' stroke-width='2.5' marker-end='url(#n)'/><text x='220' y='270' font-size='13' fill='#b15a2b' text-anchor='middle' font-weight='normal'>pháp tuyến n (hướng ra)</text><rect x='400' y='55' width='520' height='200' rx='10' fill='#fafafa' stroke='#ccc' stroke-width='2'/><text x='660' y='90' font-size='15' fill='#222' text-anchor='middle' font-weight='700'>χ = 1 trong vật, χ = 0 ngoài vật</text><text x='660' y='125' font-size='14' fill='#222' text-anchor='middle' font-weight='normal'>∇χ ≈ 0 hầu khắp nơi</text><text x='660' y='150' font-size='14' fill='#222' text-anchor='middle' font-weight='normal'>∇χ chỉ khác 0 gần bề mặt, và hướng theo n</text><text x='660' y='185' font-size='15' fill='#2f3e7a' text-anchor='middle' font-weight='700'>⇒ xây V từ (p_i, n_i) sao cho V ≈ ∇χ</text><text x='660' y='220' font-size='15' fill='#2e7d32' text-anchor='middle' font-weight='700'>⇒ Δχ = ∇·V   (phương trình Poisson)</text></svg>