<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 290' font-family='Noto Sans,Helvetica,Arial,sans-serif'><title>Chuỗi SDF-occupancy</title><rect width='960' height='290' fill='white'/><rect x='20' y='40' width='200' height='90' rx='10' fill='#f7efe6' stroke='#b15a2b' stroke-width='2'/><text x='120.0' y='78' font-size='15' fill='#222' text-anchor='middle' font-weight='700'>Eikonal (có nhớt)</text><text x='120.0' y='102' font-size='12' fill='#555' text-anchor='middle' font-weight='normal'>‖∇u‖²−1 = (1/λ)Δu</text><rect x='260' y='40' width='200' height='90' rx='10' fill='#edf4ff' stroke='#2f3e7a' stroke-width='2'/><text x='360.0' y='78' font-size='15' fill='#222' text-anchor='middle' font-weight='700'>Hopf–Cole có dấu</text><text x='360.0' y='102' font-size='12' fill='#555' text-anchor='middle' font-weight='normal'>w = sign_w exp(−λ sign_w u)</text><rect x='500' y='40' width='220' height='90' rx='10' fill='#edf4ff' stroke='#2f3e7a' stroke-width='2'/><text x='610.0' y='78' font-size='15' fill='#222' text-anchor='middle' font-weight='700'>Laplace chắn bước nhảy</text><text x='610.0' y='102' font-size='12' fill='#555' text-anchor='middle' font-weight='normal'>Δw − λ²w = 0,  w±=±1</text><rect x='760' y='40' width='180' height='90' rx='10' fill='#eef7ee' stroke='#2e7d32' stroke-width='2'/><text x='850.0' y='78' font-size='15' fill='#222' text-anchor='middle' font-weight='700'>Poisson chắn</text><text x='850.0' y='102' font-size='12' fill='#555' text-anchor='middle' font-weight='normal'>Δw − λ²w = −2(∇·n)μ</text><defs><marker id='a22085' markerWidth='8' markerHeight='8' refX='7' refY='3' orient='auto'><path d='M0,0 L8,3 L0,6 Z' fill='#2f3e7a'/></marker></defs><line x1='220' y1='85' x2='260' y2='85' stroke='#2f3e7a' stroke-width='2.2' marker-end='url(#a22085)'/><defs><marker id='a46085' markerWidth='8' markerHeight='8' refX='7' refY='3' orient='auto'><path d='M0,0 L8,3 L0,6 Z' fill='#2f3e7a'/></marker></defs><line x1='460' y1='85' x2='500' y2='85' stroke='#2f3e7a' stroke-width='2.2' marker-end='url(#a46085)'/><defs><marker id='a72085' markerWidth='8' markerHeight='8' refX='7' refY='3' orient='auto'><path d='M0,0 L8,3 L0,6 Z' fill='#2f3e7a'/></marker></defs><line x1='720' y1='85' x2='760' y2='85' stroke='#2f3e7a' stroke-width='2.2' marker-end='url(#a72085)'/><rect x='120' y='180' width='320' height='90' rx='10' fill='#f7efe6' stroke='#b15a2b' stroke-width='2'/><text x='280' y='215' font-size='16' fill='#b15a2b' text-anchor='middle' font-weight='700'>λ → 0</text><text x='280' y='240' font-size='13' fill='#222' text-anchor='middle' font-weight='normal'>hàm điều hòa bước nhảy = winding number</text><text x='280' y='260' font-size='13' fill='#222' text-anchor='middle' font-weight='normal'>occupancy / trong–ngoài  (PSR = winding + Gauss)</text><rect x='520' y='180' width='360' height='90' rx='10' fill='#eef7ee' stroke='#2e7d32' stroke-width='2'/><text x='700' y='215' font-size='16' fill='#2e7d32' text-anchor='middle' font-weight='700'>λ → ∞</text><text x='700' y='240' font-size='14' fill='#222' text-anchor='middle' font-weight='normal'>u = −(1/λ) sign_w log|w|</text><text x='700' y='260' font-size='13' fill='#222' text-anchor='middle' font-weight='normal'>xấp xỉ SDF  (Hình 4, Points as Tori)</text><defs><marker id='a370130' markerWidth='8' markerHeight='8' refX='7' refY='3' orient='auto'><path d='M0,0 L8,3 L0,6 Z' fill='#b15a2b'/></marker></defs><line x1='370' y1='130' x2='280' y2='180' stroke='#b15a2b' stroke-width='2.2' marker-end='url(#a370130)'/><defs><marker id='a690130' markerWidth='8' markerHeight='8' refX='7' refY='3' orient='auto'><path d='M0,0 L8,3 L0,6 Z' fill='#2e7d32'/></marker></defs><line x1='690' y1='130' x2='700' y2='180' stroke='#2e7d32' stroke-width='2.2' marker-end='url(#a690130)'/><text x='480' y='20' font-size='15' fill='#2f3e7a' text-anchor='middle' font-weight='700'>Chuỗi hợp nhất SDF ↔ occupancy (Feng et al., TOG 2026 §2.1)</text></svg>