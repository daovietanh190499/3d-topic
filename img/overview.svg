<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 250' font-family='Helvetica,Arial,sans-serif'><title>Năm biểu diễn cảnh 3D</title><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#555'/></marker></defs><rect width='1000' height='250' fill='white'/><rect x='8' y='50' width='180' height='150' rx='10' fill='#eef6ee' stroke='#2e7d32' stroke-width='2'/><text x='98.0' y='99.4' font-size='16.0' text-anchor='middle' font-weight='bold' fill='#2e7d32'>NeRF (2020)</text><text x='98.0' y='120.2' font-size='14.1' text-anchor='middle' font-weight='normal' fill='#222'>MLP liên tục</text><text x='98.0' y='141.0' font-size='14.1' text-anchor='middle' font-weight='normal' fill='#222'>(c, σ) = F_Θ(x, d)</text><text x='98.0' y='161.8' font-size='14.1' text-anchor='middle' font-weight='normal' fill='#222'>ray marching</text><line x1='188' y1='125' x2='206' y2='125' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><rect x='206' y='50' width='180' height='150' rx='10' fill='#eef6ee' stroke='#2e7d32' stroke-width='2'/><text x='296.0' y='99.4' font-size='16.0' text-anchor='middle' font-weight='bold' fill='#2e7d32'>NeuS (2021)</text><text x='296.0' y='120.2' font-size='14.1' text-anchor='middle' font-weight='normal' fill='#222'>SDF nơ-ron</text><text x='296.0' y='141.0' font-size='14.1' text-anchor='middle' font-weight='normal' fill='#222'>f(x) = 0 là bề mặt</text><text x='296.0' y='161.8' font-size='14.1' text-anchor='middle' font-weight='normal' fill='#222'>trọng số không lệch</text><line x1='386' y1='125' x2='404' y2='125' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><rect x='404' y='50' width='180' height='150' rx='10' fill='#fdecea' stroke='#a33a1f' stroke-width='2'/><text x='494.0' y='99.4' font-size='16.0' text-anchor='middle' font-weight='bold' fill='#a33a1f'>Plenoxels (2022)</text><text x='494.0' y='120.2' font-size='14.1' text-anchor='middle' font-weight='normal' fill='#222'>lưới voxel thưa</text><text x='494.0' y='141.0' font-size='14.1' text-anchor='middle' font-weight='normal' fill='#222'>(σ, SH) tại đỉnh</text><text x='494.0' y='161.8' font-size='14.1' text-anchor='middle' font-weight='normal' fill='#222'>nội suy ba tuyến tính</text><line x1='584' y1='125' x2='602' y2='125' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><rect x='602' y='50' width='180' height='150' rx='10' fill='#f7efe6' stroke='#b15a2b' stroke-width='2'/><text x='692.0' y='99.4' font-size='16.0' text-anchor='middle' font-weight='bold' fill='#b15a2b'>3DGS (2023)</text><text x='692.0' y='120.2' font-size='14.1' text-anchor='middle' font-weight='normal' fill='#222'>Gaussian tường minh</text><text x='692.0' y='141.0' font-size='14.1' text-anchor='middle' font-weight='normal' fill='#222'>μ, Σ, o, SH</text><text x='692.0' y='161.8' font-size='14.1' text-anchor='middle' font-weight='normal' fill='#222'>rasterization theo ô</text><line x1='782' y1='125' x2='800' y2='125' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><rect x='800' y='50' width='180' height='150' rx='10' fill='#edf4ff' stroke='#2f3e7a' stroke-width='2'/><text x='890.0' y='99.4' font-size='16.0' text-anchor='middle' font-weight='bold' fill='#2f3e7a'>RadFoam (2025)</text><text x='890.0' y='120.2' font-size='14.1' text-anchor='middle' font-weight='normal' fill='#222'>bọt Voronoi</text><text x='890.0' y='141.0' font-size='14.1' text-anchor='middle' font-weight='normal' fill='#222'>(σ, SH) hằng mỗi ô</text><text x='890.0' y='161.8' font-size='14.1' text-anchor='middle' font-weight='normal' fill='#222'>dò tia duyệt mặt</text><text x='500' y='30' font-size='15' text-anchor='middle' font-weight='bold' fill='#2f3e7a'>Cùng mô hình kết xuất thể tích C = Σ Tᵢ αᵢ cᵢ, khác nhau ở biểu diễn và cách duyệt tia</text><text x='500' y='235' font-size='14' text-anchor='middle' font-weight='normal' fill='#444'>Xu hướng: ẩn và chậm → tường minh và nhanh; NeuS bổ sung bề mặt SDF</text></svg>