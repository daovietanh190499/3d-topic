<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 360' font-family='Helvetica,Arial,sans-serif'><title>Tiền cảnh là lưới voxel trong mặt cầu đơn vị; hậu cảnh là 64 mặt cầu đồng tâm đều theo nghịch đảo bán kính</title><rect width='1000' height='360' fill='white'/><circle cx='250' cy='180' r='55.0' fill='none' stroke='#2f3e7a' stroke-width='2.5'/><circle cx='250' cy='180' r='62.9' fill='none' stroke='#8a96c8' stroke-width='1.5'/><circle cx='250' cy='180' r='73.3' fill='none' stroke='#8a96c8' stroke-width='1.5'/><circle cx='250' cy='180' r='88.0' fill='none' stroke='#8a96c8' stroke-width='1.5'/><circle cx='250' cy='180' r='110.0' fill='none' stroke='#8a96c8' stroke-width='1.5'/><circle cx='250' cy='180' r='146.7' fill='none' stroke='#8a96c8' stroke-width='1.5'/><circle cx='250' cy='180' r='220.0' fill='none' stroke='#8a96c8' stroke-width='1.5'/><rect x='211.5' y='141.5' width='77.0' height='77.0' fill='#e6eefc' stroke='#2f3e7a' stroke-width='2'/><line x1='237.2' y1='141.5' x2='237.2' y2='218.5' stroke='#2f3e7a' stroke-width='0.8'/><line x1='211.5' y1='167.2' x2='288.5' y2='167.2' stroke='#2f3e7a' stroke-width='0.8'/><line x1='262.8' y1='141.5' x2='262.8' y2='218.5' stroke='#2f3e7a' stroke-width='0.8'/><line x1='211.5' y1='192.8' x2='288.5' y2='192.8' stroke='#2f3e7a' stroke-width='0.8'/><rect x='0' y='0' width='1000' height='14' fill='white'/><rect x='0' y='346' width='1000' height='14' fill='white'/><rect x='505' y='0' width='495' height='360' fill='white'/><line x1='230' y1='190' x2='490' y2='30' stroke='#b15a2b' stroke-width='2.5'/><circle cx='230' cy='190' r='6' fill='#b15a2b'/><text x='230.0' y='285.0' font-size='14' fill='#b15a2b' text-anchor='middle' font-weight='normal'>camera (trong cảnh)</text><line x1='230' y1='196' x2='230' y2='271' stroke='#b15a2b' stroke-width='1' stroke-dasharray='3,3'/><text x='278.0' y='152.0' font-size='14' fill='#2f3e7a' text-anchor='middle' font-weight='bold'>lưới</text><text x='270.0' y='253.0' font-size='14' fill='#2f3e7a' text-anchor='middle' font-weight='normal'>r = 1</text><text x='245.0' y='334.0' font-size='15' fill='#444' text-anchor='middle' font-weight='normal'>càng xa, các mặt cầu càng thưa (đều theo 1/r)</text><text x='520.0' y='34.0' font-size='17' fill='#2f3e7a' text-anchor='start' font-weight='bold'>Mô hình nền đa mặt cầu (MSI)</text><text x='520.0' y='82.0' font-size='15' fill='#b15a2b' text-anchor='start' font-weight='bold'>Tiền cảnh</text><text x='640.0' y='82.0' font-size='15' fill='#222' text-anchor='start' font-weight='normal'>lưới voxel thưa trong mặt cầu đơn vị</text><text x='520.0' y='132.0' font-size='15' fill='#b15a2b' text-anchor='start' font-weight='bold'>Hậu cảnh</text><text x='640.0' y='132.0' font-size='15' fill='#222' text-anchor='start' font-weight='normal'>K = 64 mặt cầu, 1/r_k = 1 − k/K</text><text x='520.0' y='182.0' font-size='15' fill='#b15a2b' text-anchor='start' font-weight='bold'>Mỗi mặt cầu</text><text x='640.0' y='182.0' font-size='15' fill='#222' text-anchor='start' font-weight='normal'>ảnh equirect 2048 × 1024, (σ, RGB)</text><text x='520.0' y='232.0' font-size='15' fill='#b15a2b' text-anchor='start' font-weight='bold'>Nội suy</text><text x='640.0' y='232.0' font-size='15' fill='#222' text-anchor='start' font-weight='normal'>ba tuyến tính theo (θ, φ, 1/r)</text><text x='520.0' y='282.0' font-size='15' fill='#b15a2b' text-anchor='start' font-weight='bold'>Tỉa</text><text x='640.0' y='282.0' font-size='15' fill='#222' text-anchor='start' font-weight='normal'>chỉ theo σ; TV quấn quanh mép ảnh</text><text x='520.0' y='340.0' font-size='15' fill='#2e7d32' text-anchor='start' font-weight='bold'>Cảnh hướng thẳng: dùng NDC thay cho MSI</text></svg>