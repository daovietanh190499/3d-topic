<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 300' font-family='Helvetica,Arial,sans-serif'><title>Vòng tối ưu Plenoxels</title><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#555'/></marker></defs><rect width='1000' height='300' fill='white'/><rect x='10' y='90' width='150' height='90' rx='10' fill='#edf4ff' stroke='#2f3e7a' stroke-width='2'/><text x='85.0' y='120.8' font-size='15.0' text-anchor='middle' font-weight='bold' fill='#2f3e7a'>Ảnh + tư thế</text><text x='85.0' y='140.2' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>5000 tia mỗi batch</text><text x='85.0' y='159.8' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>chọn ngẫu nhiên</text><line x1='160' y1='135' x2='195' y2='135' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><rect x='195' y='90' width='165' height='90' rx='10' fill='#f7efe6' stroke='#b15a2b' stroke-width='2'/><text x='277.5' y='120.8' font-size='15.0' text-anchor='middle' font-weight='bold' fill='#b15a2b'>Ray marching</text><text x='277.5' y='140.2' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>bước ½ voxel</text><text x='277.5' y='159.8' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>bỏ qua ô rỗng</text><line x1='360' y1='135' x2='395' y2='135' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><rect x='395' y='90' width='165' height='90' rx='10' fill='#edf4ff' stroke='#2f3e7a' stroke-width='2'/><text x='477.5' y='120.8' font-size='15.0' text-anchor='middle' font-weight='bold' fill='#2f3e7a'>Nội suy 8 góc</text><text x='477.5' y='140.2' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>σ, 27 hệ số SH</text><text x='477.5' y='159.8' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>→ (σᵢ, cᵢ)</text><line x1='560' y1='135' x2='595' y2='135' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><rect x='595' y='90' width='170' height='90' rx='10' fill='#f7efe6' stroke='#b15a2b' stroke-width='2'/><text x='680.0' y='120.8' font-size='15.0' text-anchor='middle' font-weight='bold' fill='#b15a2b'>Kết xuất thể tích</text><text x='680.0' y='140.2' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>Ĉ = Σ Tᵢ(1−e^(−σᵢδᵢ))cᵢ</text><text x='680.0' y='159.8' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>cùng kernel CUDA</text><line x1='765' y1='135' x2='800' y2='135' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><rect x='800' y='90' width='185' height='90' rx='10' fill='#fdecea' stroke='#a33a1f' stroke-width='2'/><text x='892.5' y='120.8' font-size='15.0' text-anchor='middle' font-weight='bold' fill='#a33a1f'>MSE + TV (1% voxel)</text><text x='892.5' y='140.2' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>+ Cauchy, beta</text><text x='892.5' y='159.8' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>(cảnh thật)</text><path d='M 892 180 L 892 250 L 600 250' fill='none' stroke='#a33a1f' stroke-width='2' marker-end='url(#ar)' stroke-dasharray='6,4'/><rect x='390' y='222' width='210' height='58' rx='10' fill='#eef6ee' stroke='#2e7d32' stroke-width='2'/><text x='495.0' y='246.5' font-size='15.0' text-anchor='middle' font-weight='bold' fill='#2e7d32'>RMSProp thưa</text><text x='495.0' y='266.0' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>chỉ voxel có gradient</text><path d='M 390 250 L 110 250 L 110 185' fill='none' stroke='#2e7d32' stroke-width='2' marker-end='url(#ar)'/><text x='250' y='272' font-size='14' text-anchor='middle' font-weight='normal' fill='#2e7d32'>mỗi 25 600 bước: tỉa + chia đôi lưới</text><text x='500' y='40' font-size='16' text-anchor='middle' font-weight='bold' fill='#2f3e7a'>Không có mạng nơ-ron: gradient đi thẳng vào σ và hệ số SH của 8 voxel quanh mỗi mẫu</text></svg>