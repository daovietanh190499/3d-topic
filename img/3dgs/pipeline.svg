<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 330' font-family='Helvetica,Arial,sans-serif'><title>Pipeline huấn luyện 3D Gaussian Splatting</title><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#555'/></marker></defs><rect width='1000' height='330' fill='white'/><rect x='10' y='100' width='140' height='90' rx='10' fill='#edf4ff' stroke='#2f3e7a' stroke-width='2'/><text x='80.0' y='130.8' font-size='15.0' text-anchor='middle' font-weight='bold' fill='#2f3e7a'>SfM (COLMAP)</text><text x='80.0' y='150.2' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>đám mây điểm</text><text x='80.0' y='169.8' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>thưa + camera</text><line x1='150' y1='145' x2='190' y2='145' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><rect x='190' y='90' width='170' height='110' rx='10' fill='#edf4ff' stroke='#2f3e7a' stroke-width='2'/><text x='275.0' y='130.8' font-size='15.0' text-anchor='middle' font-weight='bold' fill='#2f3e7a'>Gaussian 3D</text><text x='275.0' y='150.2' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>μ, q, s, o, SH</text><text x='275.0' y='169.8' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>59 số thực / Gaussian</text><line x1='360' y1='145' x2='400' y2='145' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><rect x='400' y='90' width='150' height='110' rx='10' fill='#f7efe6' stroke='#b15a2b' stroke-width='2'/><text x='475.0' y='130.8' font-size='15.0' text-anchor='middle' font-weight='bold' fill='#b15a2b'>Chiếu EWA</text><text x='475.0' y='150.2' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>Σ′ = J W Σ Wᵀ Jᵀ</text><text x='475.0' y='169.8' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>(2D, mỗi camera)</text><line x1='550' y1='145' x2='590' y2='145' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><rect x='590' y='90' width='180' height='110' rx='10' fill='#f7efe6' stroke='#b15a2b' stroke-width='2'/><text x='680.0' y='130.8' font-size='15.0' text-anchor='middle' font-weight='bold' fill='#b15a2b'>Rasterizer theo ô</text><text x='680.0' y='150.2' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>ô 16×16, sắp xếp</text><text x='680.0' y='169.8' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>radix theo độ sâu</text><line x1='770' y1='145' x2='810' y2='145' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><rect x='810' y='100' width='170' height='90' rx='10' fill='#f7efe6' stroke='#b15a2b' stroke-width='2'/><text x='895.0' y='130.8' font-size='15.0' text-anchor='middle' font-weight='bold' fill='#b15a2b'>Ảnh kết xuất</text><text x='895.0' y='150.2' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>α-blending</text><text x='895.0' y='169.8' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>trước → sau</text><line x1='895' y1='190' x2='895' y2='230' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><rect x='760' y='230' width='230' height='70' rx='10' fill='#fdecea' stroke='#a33a1f' stroke-width='2'/><text x='875.0' y='260.8' font-size='14.0' text-anchor='middle' font-weight='bold' fill='#a33a1f'>L = (1−λ)L₁ + λ L_D-SSIM</text><text x='875.0' y='279.0' font-size='12.3' text-anchor='middle' font-weight='normal' fill='#222'>λ = 0,2</text><path d='M 760 265 L 320 265 L 320 205' fill='none' stroke='#a33a1f' stroke-width='2' marker-end='url(#ar)' stroke-dasharray='6,4'/><text x='540' y='288' font-size='13' text-anchor='middle' font-weight='normal' fill='#a33a1f'>gradient theo μ, q, s, o, SH (lan truyền ngược qua rasterizer)</text><rect x='10' y='230' width='165' height='75' rx='10' fill='#eef6ee' stroke='#2e7d32' stroke-width='2'/><text x='92.5' y='254.2' font-size='14.0' text-anchor='middle' font-weight='bold' fill='#2e7d32'>Điều khiển mật độ</text><text x='92.5' y='272.4' font-size='12.3' text-anchor='middle' font-weight='normal' fill='#222'>clone · split · prune</text><text x='92.5' y='290.6' font-size='12.3' text-anchor='middle' font-weight='normal' fill='#222'>mỗi 100 vòng</text><path d='M 175 262 L 235 262 L 235 205' fill='none' stroke='#2e7d32' stroke-width='2' marker-end='url(#ar)'/><text x='500' y='40' font-size='16' text-anchor='middle' font-weight='bold' fill='#2f3e7a'>Biểu diễn tường minh + rasterization khả vi thay cho MLP + ray marching</text></svg>