<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 330' font-family='Helvetica,Arial,sans-serif'><title>Gaussian 3D dị hướng và phép chiếu xuống ảnh</title><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#555'/></marker></defs><rect width='1000' height='330' fill='white'/><g transform='rotate(-30 200 180)'><ellipse cx='200' cy='180' rx='130' ry='48' fill='#b15a2b' fill-opacity='.18' stroke='#b15a2b' stroke-width='2'/><ellipse cx='200' cy='180' rx='80' ry='30' fill='#b15a2b' fill-opacity='.22'/><line x1='200' y1='180' x2='330' y2='180' stroke='#2f3e7a' stroke-width='2.5' marker-end='url(#ar)'/><line x1='200' y1='180' x2='200' y2='132' stroke='#2f3e7a' stroke-width='2.5' marker-end='url(#ar)'/></g><circle cx='200' cy='180' r='4' fill='#222'/><text x='190' y='202' font-size='16' text-anchor='middle' font-weight='bold' fill='#222'>μ</text><text x='320' y='105' font-size='15' text-anchor='middle' font-weight='bold' fill='#2f3e7a'>s₁ r₁</text><text x='150' y='120' font-size='15' text-anchor='middle' font-weight='bold' fill='#2f3e7a'>s₂ r₂</text><text x='200' y='300' font-size='16' text-anchor='middle' font-weight='bold' fill='#2f3e7a'>Σ = R S Sᵀ Rᵀ,  R = R(q),  S = diag(s)</text><text x='200' y='40' font-size='16' text-anchor='middle' font-weight='bold' fill='#222'>Không gian thế giới</text><line x1='390' y1='180' x2='520' y2='180' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><text x='455.0' y='168.0' font-size='14' text-anchor='middle' fill='#555'>W (camera), J (Jacobi)</text><rect x='540' y='60' width='280' height='220' fill='#fafafa' stroke='#888'/><line x1='580' y1='60' x2='580' y2='280' stroke='#ddd'/><line x1='620' y1='60' x2='620' y2='280' stroke='#ddd'/><line x1='660' y1='60' x2='660' y2='280' stroke='#ddd'/><line x1='700' y1='60' x2='700' y2='280' stroke='#ddd'/><line x1='740' y1='60' x2='740' y2='280' stroke='#ddd'/><line x1='780' y1='60' x2='780' y2='280' stroke='#ddd'/><line x1='540' y1='100' x2='820' y2='100' stroke='#ddd'/><line x1='540' y1='140' x2='820' y2='140' stroke='#ddd'/><line x1='540' y1='180' x2='820' y2='180' stroke='#ddd'/><line x1='540' y1='220' x2='820' y2='220' stroke='#ddd'/><line x1='540' y1='260' x2='820' y2='260' stroke='#ddd'/><g transform='rotate(-18 680 170)'><ellipse cx='680' cy='170' rx='95' ry='40' fill='#2f3e7a' fill-opacity='.18' stroke='#2f3e7a' stroke-width='2'/><ellipse cx='680' cy='170' rx='57' ry='24' fill='#2f3e7a' fill-opacity='.2'/></g><circle cx='680' cy='170' r='4' fill='#222'/><text x='690' y='195' font-size='16' text-anchor='start' font-weight='bold' fill='#222'>μ′</text><text x='680' y='40' font-size='16' text-anchor='middle' font-weight='bold' fill='#222'>Mặt phẳng ảnh (lưới pixel)</text><text x='680' y='305' font-size='16' text-anchor='middle' font-weight='bold' fill='#2f3e7a'>Σ′ = (J W Σ Wᵀ Jᵀ) lấy khối 2×2</text><text x='910' y='140' font-size='15' text-anchor='middle' font-weight='normal' fill='#222'>α(x′) =</text><text x='910' y='165' font-size='14' text-anchor='middle' font-weight='normal' fill='#222'>o · exp(−½ Δᵀ Σ′⁻¹ Δ)</text><text x='910' y='190' font-size='14' text-anchor='middle' font-weight='normal' fill='#555'>Δ = x′ − μ′</text></svg>