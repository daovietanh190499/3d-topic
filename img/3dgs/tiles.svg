<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 330' font-family='Helvetica,Arial,sans-serif'><title>Rasterizer theo ô của 3DGS</title><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#555'/></marker></defs><rect width='1000' height='330' fill='white'/><rect x='30' y='60' width='50' height='50' fill='white' stroke='#bbb'/><rect x='30' y='110' width='50' height='50' fill='white' stroke='#bbb'/><rect x='30' y='160' width='50' height='50' fill='white' stroke='#bbb'/><rect x='30' y='210' width='50' height='50' fill='white' stroke='#bbb'/><rect x='80' y='60' width='50' height='50' fill='white' stroke='#bbb'/><rect x='80' y='110' width='50' height='50' fill='white' stroke='#bbb'/><rect x='80' y='160' width='50' height='50' fill='white' stroke='#bbb'/><rect x='80' y='210' width='50' height='50' fill='white' stroke='#bbb'/><rect x='130' y='60' width='50' height='50' fill='white' stroke='#bbb'/><rect x='130' y='110' width='50' height='50' fill='white' stroke='#bbb'/><rect x='130' y='160' width='50' height='50' fill='white' stroke='#bbb'/><rect x='130' y='210' width='50' height='50' fill='white' stroke='#bbb'/><rect x='180' y='60' width='50' height='50' fill='white' stroke='#bbb'/><rect x='180' y='110' width='50' height='50' fill='white' stroke='#bbb'/><rect x='180' y='160' width='50' height='50' fill='white' stroke='#bbb'/><rect x='180' y='210' width='50' height='50' fill='white' stroke='#bbb'/><rect x='230' y='60' width='50' height='50' fill='white' stroke='#bbb'/><rect x='230' y='110' width='50' height='50' fill='white' stroke='#bbb'/><rect x='230' y='160' width='50' height='50' fill='white' stroke='#bbb'/><rect x='230' y='210' width='50' height='50' fill='white' stroke='#bbb'/><rect x='280' y='60' width='50' height='50' fill='white' stroke='#bbb'/><rect x='280' y='110' width='50' height='50' fill='white' stroke='#bbb'/><rect x='280' y='160' width='50' height='50' fill='white' stroke='#bbb'/><rect x='280' y='210' width='50' height='50' fill='white' stroke='#bbb'/><ellipse cx='100' cy='110' rx='55' ry='22' transform='rotate(-20 100 110)' fill='#b15a2b' fill-opacity='.3' stroke='#b15a2b'/><ellipse cx='190' cy='150' rx='40' ry='30' transform='rotate(30 190 150)' fill='#2f3e7a' fill-opacity='.3' stroke='#2f3e7a'/><ellipse cx='240' cy='200' rx='70' ry='20' transform='rotate(10 240 200)' fill='#2e7d32' fill-opacity='.3' stroke='#2e7d32'/><text x='180' y='45' font-size='15' text-anchor='middle' font-weight='bold' fill='#222'>Màn hình chia ô 16×16 pixel</text><text x='180' y='285' font-size='13' text-anchor='middle' font-weight='normal' fill='#444'>Mỗi Gaussian được nhân bản cho mọi ô</text><text x='180' y='303' font-size='13' text-anchor='middle' font-weight='normal' fill='#444'>mà elip 99% tin cậy của nó phủ lên</text><line x1='340' y1='160' x2='380' y2='160' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><rect x='380' y='80' width='250' height='160' rx='10' fill='#f7efe6' stroke='#b15a2b' stroke-width='2'/><text x='505.0' y='128.5' font-size='14.0' text-anchor='middle' font-weight='bold' fill='#b15a2b'>Khóa 64 bit</text><text x='505.0' y='146.7' font-size='12.3' text-anchor='middle' font-weight='normal' fill='#222'>[ ID ô | độ sâu z ]</text><text x='505.0' y='164.9' font-size='12.3' text-anchor='middle' font-weight='normal' fill='#222'>một lần radix sort</text><text x='505.0' y='183.1' font-size='12.3' text-anchor='middle' font-weight='normal' fill='#222'>trên GPU cho cả ảnh</text><text x='505.0' y='201.3' font-size='12.3' text-anchor='middle' font-weight='normal' fill='#222'>→ danh sách mỗi ô</text><line x1='630' y1='160' x2='670' y2='160' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><rect x='670' y='70' width='310' height='180' rx='10' fill='#eef6ee' stroke='#2e7d32' stroke-width='2'/><text x='825.0' y='128.5' font-size='14.0' text-anchor='middle' font-weight='bold' fill='#2e7d32'>Mỗi ô = 1 thread block</text><text x='825.0' y='146.7' font-size='12.3' text-anchor='middle' font-weight='normal' fill='#222'>nạp Gaussian vào bộ nhớ chia sẻ</text><text x='825.0' y='164.9' font-size='12.3' text-anchor='middle' font-weight='normal' fill='#222'>mỗi pixel: C += T·αᵢ·cᵢ, T ← T(1−αᵢ)</text><text x='825.0' y='183.1' font-size='12.3' text-anchor='middle' font-weight='normal' fill='#222'>dừng khi độ phủ α tiệm cận 1</text><text x='825.0' y='201.3' font-size='12.3' text-anchor='middle' font-weight='normal' fill='#222'>(không vượt quá 0,9999)</text><text x='680' y='285' font-size='13' text-anchor='middle' font-weight='normal' fill='#444'>Lan truyền ngược: duyệt lại danh sách từ sau ra trước,</text><text x='680' y='305' font-size='13' text-anchor='middle' font-weight='normal' fill='#444'>chỉ lưu độ phủ cuối mỗi pixel để khôi phục Tᵢ</text></svg>