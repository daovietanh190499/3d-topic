<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 330' font-family='Helvetica,Arial,sans-serif'><title>Clone và split trong điều khiển mật độ thích nghi</title><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#555'/></marker></defs><rect width='1000' height='330' fill='white'/><text x='250' y='30' font-size='15' text-anchor='middle' font-weight='bold' fill='#b15a2b'>Thiếu tái tạo (under-reconstruction) → CLONE</text><text x='750' y='30' font-size='15' text-anchor='middle' font-weight='bold' fill='#2f3e7a'>Tái tạo thừa (over-reconstruction) → SPLIT</text><path d='M 40 160 C 100 60, 180 60, 240 160' fill='none' stroke='#222' stroke-width='2.2'/><ellipse cx='100' cy='112' rx='26' ry='12' transform='rotate(-45 100 112)' fill='#b15a2b' fill-opacity='.45' stroke='#b15a2b'/><path d='M 280 160 C 340 60, 420 60, 480 160' fill='none' stroke='#222' stroke-width='2.2'/><ellipse cx='340' cy='112' rx='26' ry='12' transform='rotate(-45 340 112)' fill='#b15a2b' fill-opacity='.45' stroke='#b15a2b'/><ellipse cx='380' cy='88' rx='26' ry='12' fill='#b15a2b' fill-opacity='.45' stroke='#b15a2b'/><line x1='245' y1='130' x2='275' y2='130' stroke='#b15a2b' stroke-width='2' marker-end='url(#ar)'/><text x='250' y='215' font-size='14' text-anchor='middle' font-weight='normal' fill='#222'>Gaussian nhỏ ở vùng thiếu hình học:</text><text x='250' y='237' font-size='14' text-anchor='middle' font-weight='normal' fill='#222'>sao chép cùng kích thước, dời theo gradient vị trí</text><text x='250' y='259' font-size='14' text-anchor='middle' font-weight='normal' fill='#555'>(tăng cả tổng thể tích lẫn số Gaussian)</text><path d='M 540 160 C 600 60, 680 60, 740 160' fill='none' stroke='#222' stroke-width='2.2'/><ellipse cx='640' cy='95' rx='95' ry='26' fill='#2f3e7a' fill-opacity='.3' stroke='#2f3e7a'/><path d='M 780 160 C 840 60, 920 60, 980 160' fill='none' stroke='#222' stroke-width='2.2'/><ellipse cx='835' cy='104' rx='40' ry='13' transform='rotate(-40 835 104)' fill='#2f3e7a' fill-opacity='.4' stroke='#2f3e7a'/><ellipse cx='925' cy='104' rx='40' ry='13' transform='rotate(40 925 104)' fill='#2f3e7a' fill-opacity='.4' stroke='#2f3e7a'/><line x1='745' y1='130' x2='775' y2='130' stroke='#2f3e7a' stroke-width='2' marker-end='url(#ar)'/><text x='750' y='215' font-size='14' text-anchor='middle' font-weight='normal' fill='#222'>Gaussian lớn phủ vùng chi tiết cao:</text><text x='750' y='237' font-size='14' text-anchor='middle' font-weight='normal' fill='#222'>thay bằng 2 Gaussian, tỉ lệ chia φ = 1,6,</text><text x='750' y='259' font-size='14' text-anchor='middle' font-weight='normal' fill='#555'>vị trí lấy mẫu từ chính Gaussian gốc (giữ thể tích)</text><text x='500' y='305' font-size='15' text-anchor='middle' font-weight='bold' fill='#a33a1f'>Điều kiện chung: trung bình ‖∇_μ′ L‖ trong không gian ảnh &gt; τ_pos = 0,0002; kiểm tra mỗi 100 vòng</text></svg>