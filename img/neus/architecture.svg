<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 330' font-family='Helvetica,Arial,sans-serif'><title>Kiến trúc NeuS</title><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#555'/></marker></defs><rect width='1000' height='330' fill='white'/><rect x='10' y='120' width='120' height='70' rx='10' fill='#edf4ff' stroke='#2f3e7a' stroke-width='2'/><text x='70.0' y='150.5' font-size='15.0' text-anchor='middle' font-weight='bold' fill='#2f3e7a'>x ∈ ℝ³</text><text x='70.0' y='170.0' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>γ(x), L = 6</text><line x1='130' y1='155' x2='170' y2='155' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><rect x='170' y='100' width='200' height='110' rx='10' fill='#eef6ee' stroke='#2e7d32' stroke-width='2'/><text x='270.0' y='140.8' font-size='15.0' text-anchor='middle' font-weight='bold' fill='#2e7d32'>MLP SDF f_θ</text><text x='270.0' y='160.2' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>8 lớp × 256, nối tắt lớp 4</text><text x='270.0' y='179.8' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>khởi tạo hình học (cầu)</text><line x1='370' y1='130' x2='430' y2='85' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><rect x='430' y='55' width='150' height='60' rx='10' fill='#f7efe6' stroke='#b15a2b' stroke-width='2'/><text x='505.0' y='80.8' font-size='14.0' text-anchor='middle' font-weight='bold' fill='#b15a2b'>f(x): SDF</text><text x='505.0' y='99.0' font-size='12.3' text-anchor='middle' font-weight='normal' fill='#222'>∇f → pháp tuyến n</text><line x1='370' y1='180' x2='430' y2='205' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><rect x='430' y='180' width='150' height='50' rx='10' fill='#eef6ee' stroke='#2e7d32' stroke-width='2'/><text x='505.0' y='200.8' font-size='14.0' text-anchor='middle' font-weight='bold' fill='#2e7d32'>đặc trưng z</text><text x='505.0' y='219.0' font-size='12.3' text-anchor='middle' font-weight='normal' fill='#222'>256 chiều</text><rect x='430' y='255' width='150' height='50' rx='10' fill='#edf4ff' stroke='#2f3e7a' stroke-width='2'/><text x='505.0' y='275.8' font-size='14.0' text-anchor='middle' font-weight='bold' fill='#2f3e7a'>hướng v</text><text x='505.0' y='294.0' font-size='12.3' text-anchor='middle' font-weight='normal' fill='#222'>γ(v), L = 4</text><line x1='580' y1='85' x2='640' y2='180' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><line x1='580' y1='205' x2='640' y2='205' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><line x1='580' y1='280' x2='640' y2='230' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><rect x='640' y='165' width='170' height='80' rx='10' fill='#eef6ee' stroke='#2e7d32' stroke-width='2'/><text x='725.0' y='191.7' font-size='14.0' text-anchor='middle' font-weight='bold' fill='#2e7d32'>MLP màu c</text><text x='725.0' y='209.9' font-size='12.3' text-anchor='middle' font-weight='normal' fill='#222'>4 lớp × 256</text><text x='725.0' y='228.1' font-size='12.3' text-anchor='middle' font-weight='normal' fill='#222'>vào: x, v, n, z</text><line x1='580' y1='70' x2='830' y2='70' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><rect x='830' y='40' width='160' height='70' rx='10' fill='#f7efe6' stroke='#b15a2b' stroke-width='2'/><text x='910.0' y='70.8' font-size='14.0' text-anchor='middle' font-weight='bold' fill='#b15a2b'>α từ Φₛ(f)</text><text x='910.0' y='89.0' font-size='12.3' text-anchor='middle' font-weight='normal' fill='#222'>biến thiên s (1 tham số)</text><line x1='810' y1='205' x2='880' y2='205' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><rect x='880' y='175' width='110' height='60' rx='10' fill='#f7efe6' stroke='#b15a2b' stroke-width='2'/><text x='935.0' y='209.9' font-size='14.0' text-anchor='middle' font-weight='bold' fill='#b15a2b'>màu cᵢ</text><line x1='910' y1='110' x2='910' y2='175' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><rect x='600' y='265' width='390' height='55' rx='10' fill='#fdecea' stroke='#a33a1f' stroke-width='2'/><text x='795.0' y='288.3' font-size='14.0' text-anchor='middle' font-weight='bold' fill='#a33a1f'>Ĉ = Σ Tᵢ αᵢ cᵢ</text><text x='795.0' y='306.5' font-size='12.3' text-anchor='middle' font-weight='normal' fill='#222'>nền ngoài cầu đơn vị: NeRF++ (khi không có mask)</text><line x1='935' y1='235' x2='935' y2='265' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><text x='500' y='26' font-size='15' text-anchor='middle' font-weight='bold' fill='#2f3e7a'>Hình học (SDF) và màu tách thành hai mạng; hệ số s học chung với mạng</text></svg>