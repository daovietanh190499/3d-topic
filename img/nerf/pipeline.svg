<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 300' font-family='Helvetica,Arial,sans-serif'><title>Pipeline huấn luyện NeRF</title><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#555'/></marker></defs><rect width='1000' height='300' fill='white'/><rect x='10' y='90' width='150' height='90' rx='10' fill='#edf4ff' stroke='#2f3e7a' stroke-width='2'/><text x='85.0' y='120.8' font-size='15.0' text-anchor='middle' font-weight='bold' fill='#2f3e7a'>Ảnh + tư thế</text><text x='85.0' y='140.2' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>(Iₖ, Kₖ, Rₖ, tₖ)</text><text x='85.0' y='159.8' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>từ COLMAP</text><line x1='160' y1='135' x2='200' y2='135' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><rect x='200' y='90' width='150' height='90' rx='10' fill='#f7efe6' stroke='#b15a2b' stroke-width='2'/><text x='275.0' y='120.8' font-size='15.0' text-anchor='middle' font-weight='bold' fill='#b15a2b'>Tia r(t)=o+td</text><text x='275.0' y='140.2' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>qua từng pixel</text><text x='275.0' y='159.8' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>4096 tia/batch</text><line x1='350' y1='135' x2='390' y2='135' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><rect x='390' y='90' width='150' height='90' rx='10' fill='#f7efe6' stroke='#b15a2b' stroke-width='2'/><text x='465.0' y='120.8' font-size='15.0' text-anchor='middle' font-weight='bold' fill='#b15a2b'>Điểm mẫu</text><text x='465.0' y='140.2' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>(xᵢ, d), i=1..N</text><text x='465.0' y='159.8' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>phân tầng + phân cấp</text><line x1='540' y1='135' x2='580' y2='135' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><rect x='580' y='80' width='150' height='110' rx='10' fill='#eef6ee' stroke='#2e7d32' stroke-width='2'/><text x='655.0' y='120.8' font-size='15.0' text-anchor='middle' font-weight='bold' fill='#2e7d32'>MLP F_Θ</text><text x='655.0' y='140.2' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>γ(x), γ(d)</text><text x='655.0' y='159.8' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>→ (cᵢ, σᵢ)</text><line x1='730' y1='135' x2='770' y2='135' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><rect x='770' y='90' width='210' height='90' rx='10' fill='#f7efe6' stroke='#b15a2b' stroke-width='2'/><text x='875.0' y='130.5' font-size='15.0' text-anchor='middle' font-weight='bold' fill='#b15a2b'>Kết xuất thể tích</text><text x='875.0' y='150.0' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>Ĉ(r)=Σ Tᵢ(1−e^(−σᵢδᵢ))cᵢ</text><line x1='875' y1='180' x2='875' y2='225' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><rect x='720' y='225' width='260' height='60' rx='10' fill='#fdecea' stroke='#a33a1f' stroke-width='2'/><text x='850.0' y='250.8' font-size='14.0' text-anchor='middle' font-weight='bold' fill='#a33a1f'>Mất mát ‖Ĉ(r) − C(r)‖²</text><text x='850.0' y='269.0' font-size='12.3' text-anchor='middle' font-weight='normal' fill='#222'>so với màu pixel thật</text><path d='M 720 255 L 655 255 L 655 195' fill='none' stroke='#a33a1f' stroke-width='2' marker-end='url(#ar)' stroke-dasharray='6,4'/><text x='560' y='272' font-size='13' text-anchor='middle' font-weight='normal' fill='#a33a1f'>lan truyền ngược qua phép tổng khả vi</text><text x='500' y='40' font-size='16' text-anchor='middle' font-weight='bold' fill='#2f3e7a'>Toàn bộ chuỗi khả vi: chỉ cần ảnh 2D và tư thế camera để học Θ</text></svg>