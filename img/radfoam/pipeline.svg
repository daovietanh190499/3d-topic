<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 330' font-family='Helvetica,Arial,sans-serif'><title>Vòng huấn luyện Radiant Foam</title><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#555'/></marker></defs><rect width='1000' height='330' fill='white'/><rect x='10' y='110' width='140' height='90' rx='10' fill='#edf4ff' stroke='#2f3e7a' stroke-width='2'/><text x='80.0' y='140.8' font-size='15.0' text-anchor='middle' font-weight='bold' fill='#2f3e7a'>COLMAP</text><text x='80.0' y='160.2' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>điểm thưa → site</text><text x='80.0' y='179.8' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>init 131 072</text><line x1='150' y1='155' x2='190' y2='155' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><rect x='190' y='100' width='170' height='110' rx='10' fill='#edf4ff' stroke='#2f3e7a' stroke-width='2'/><text x='275.0' y='140.8' font-size='15.0' text-anchor='middle' font-weight='bold' fill='#2f3e7a'>Voronoi foam</text><text x='275.0' y='160.2' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>pᵢ, σᵢ, SH bậc 3</text><text x='275.0' y='179.8' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>kề Delaunay (CSR)</text><line x1='360' y1='155' x2='400' y2='155' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><rect x='400' y='100' width='170' height='110' rx='10' fill='#f7efe6' stroke='#b15a2b' stroke-width='2'/><text x='485.0' y='140.8' font-size='15.0' text-anchor='middle' font-weight='bold' fill='#b15a2b'>Dò tia</text><text x='485.0' y='160.2' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>duyệt mặt ô</text><text x='485.0' y='179.8' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>tích phân đúng</text><line x1='570' y1='155' x2='610' y2='155' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><rect x='610' y='100' width='170' height='110' rx='10' fill='#fdecea' stroke='#a33a1f' stroke-width='2'/><text x='695.0' y='140.8' font-size='15.0' text-anchor='middle' font-weight='bold' fill='#a33a1f'>L = L_rgb</text><text x='695.0' y='160.2' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>+ λ L_quantile</text><text x='695.0' y='179.8' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>λ = 10⁻⁴ (cấu hình)</text><line x1='780' y1='155' x2='820' y2='155' stroke='#555' stroke-width='2' marker-end='url(#ar)'/><rect x='820' y='100' width='170' height='110' rx='10' fill='#eef6ee' stroke='#2e7d32' stroke-width='2'/><text x='905.0' y='140.8' font-size='15.0' text-anchor='middle' font-weight='bold' fill='#2e7d32'>Adam</text><text x='905.0' y='160.2' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>cập nhật p, σ, SH</text><text x='905.0' y='179.8' font-size='13.2' text-anchor='middle' font-weight='normal' fill='#222'>(p cố định sau 18k)</text><path d='M 905 210 L 905 275 L 640 275' fill='none' stroke='#2e7d32' stroke-width='2' marker-end='url(#ar)'/><rect x='430' y='245' width='210' height='60' rx='10' fill='#f7efe6' stroke='#b15a2b' stroke-width='2'/><text x='535.0' y='270.8' font-size='14.0' text-anchor='middle' font-weight='bold' fill='#b15a2b'>Tam giác hóa lại</text><text x='535.0' y='289.0' font-size='12.3' text-anchor='middle' font-weight='normal' fill='#222'>mỗi k bước, k: 1 → 100</text><path d='M 430 275 L 275 275 L 275 215' fill='none' stroke='#2e7d32' stroke-width='2' marker-end='url(#ar)'/><rect x='60' y='245' width='170' height='60' rx='10' fill='#eef6ee' stroke='#2e7d32' stroke-width='2'/><text x='145.0' y='270.8' font-size='14.0' text-anchor='middle' font-weight='bold' fill='#2e7d32'>Densify / prune</text><text x='145.0' y='289.0' font-size='12.3' text-anchor='middle' font-weight='normal' fill='#222'>2k → 11k, ×1,15</text><path d='M 145 245 L 145 210 L 190 180' fill='none' stroke='#2e7d32' stroke-width='2' marker-end='url(#ar)' stroke-dasharray='5,4'/><text x='500' y='40' font-size='16' text-anchor='middle' font-weight='bold' fill='#2f3e7a'>Cùng khung tối ưu như 3DGS, nhưng kết xuất bằng ray tracing trên ô không chồng lấn</text></svg>